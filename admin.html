<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coast Luxury Villas - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="text-xl font-semibold tracking-wider text-amber-400">COAST LUXURY VILLAS // ADMIN</h1>
        <button onclick="logout()" class="text-sm bg-red-600/20 text-red-400 border border-red-600/30 px-3 py-1 rounded hover:bg-red-600/30">Logout</button>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
        <!-- Overview Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                <p class="text-sm text-slate-400">Total Properties</p>
                <h3 id="stat-properties" class="text-3xl font-bold mt-2 text-amber-400">-</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                <p class="text-sm text-slate-400">Active Bookings</p>
                <h3 id="stat-bookings" class="text-3xl font-bold mt-2 text-amber-400">-</h3>
            </div>
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
                <p class="text-sm text-slate-400">Platform Revenue</p>
                <h3 id="stat-revenue" class="text-3xl font-bold mt-2 text-amber-400">€0</h3>
            </div>
        </div>

        <!-- Property Moderation Section -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-6">
            <h2 class="text-lg font-medium mb-4 text-slate-200">Property Approvals</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="p-3">Title</th>
                            <th class="p-3">Location</th>
                            <th class="p-3">Price / Night</th>
                            <th class="p-3">Status</th>
                            <th class="p-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-properties-table" class="divide-y divide-slate-800">
                        <!-- Populated via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const activeApiUrl = window.location.origin.includes('localhost') 
            ? 'http://localhost:10000' 
            : 'https://coast-luxury-villas-backend.onrender.com';

        async function loadAdminData() {
            try {
                const res = await fetch(`${activeApiUrl}/api/admin/properties`);
                const properties = await res.json();
                
                document.getElementById('stat-properties').textContent = properties.length;
                
                const tbody = document.getElementById('admin-properties-table');
                tbody.innerHTML = properties.map(p => `
                    <tr class="hover:bg-slate-800/50">
                        <td class="p-3 font-medium text-white">${p.title}</td>
                        <td class="p-3">${p.location_city}, ${p.location_country}</td>
                        <td class="p-3">€${p.base_price_per_night}</td>
                        <td class="p-3"><span class="px-2 py-1 text-xs rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">${p.status}</span></td>
                        <td class="p-3 space-x-2">
                            <button onclick="updateStatus('${p.id}', 'active')" class="text-emerald-400 hover:underline">Approve</button>
                            <button onclick="updateStatus('${p.id}', 'rejected')" class="text-red-400 hover:underline">Reject</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error loading admin data:", err);
            }
        }

        async function updateStatus(id, status) {
            await fetch(`${activeApiUrl}/api/admin/properties/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, status })
            });
            loadAdminData();
        }

        function logout() {
            window.location.href = '/index.html';
        }

        loadAdminData();
    </script>
</body>
</html>
