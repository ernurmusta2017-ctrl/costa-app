<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coast Luxury Villas - Host Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="text-xl font-semibold tracking-wider text-amber-400">COAST LUXURY VILLAS // HOST PORTAL</h1>
        <button onclick="logout()" class="text-sm bg-red-600/20 text-red-400 border border-red-600/30 px-3 py-1 rounded hover:bg-red-600/30">Logout</button>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Add Property Form -->
        <section class="bg-slate-900 border border-slate-800 rounded-xl p-6 h-fit">
            <h2 class="text-lg font-medium mb-4 text-slate-200">List New Villa</h2>
            <form id="property-form" class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Villa Title</label>
                    <input type="text" name="title" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Price / Night (€)</label>
                        <input type="number" name="price" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Max Guests</label>
                        <input type="number" name="guests" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">City</label>
                        <input type="text" name="location_city" value="Sarandë" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Country</label>
                        <input type="text" name="location_country" value="Albania" required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Image URL</label>
                    <input type="url" name="image_url" placeholder="https://..." required class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Description</label>
                    <textarea name="description" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-400"></textarea>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-medium py-2 rounded transition">Submit for Review</button>
            </form>
        </section>

        <!-- Host Properties & Bookings List -->
        <section class="lg:col-span-2 space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h2 class="text-lg font-medium mb-4 text-slate-200">Your Listed Properties</h2>
                <div id="host-properties-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Populated via JS -->
                </div>
            </div>
        </section>
    </main>

    <script>
        const activeApiUrl = window.location.origin.includes('localhost') 
            ? 'http://localhost:10000' 
            : 'https://coast-luxury-villas-backend.onrender.com';
            
        const ownerId = localStorage.getItem('user_id') || '1';

        document.getElementById('property-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            data.owner_id = ownerId;

            const res = await fetch(`${activeApiUrl}/api/admin/properties/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                alert('Property submitted successfully!');
                e.target.reset();
                loadHostProperties();
            }
        });

        async function loadHostProperties() {
            try {
                const res = await fetch(`${activeApiUrl}/api/owner/properties?owner_id=${ownerId}`);
                const properties = await res.json();
                
                const container = document.getElementById('host-properties-list');
                container.innerHTML = properties.map(p => `
                    <div class="border border-slate-800 bg-slate-950 rounded-lg p-4 space-y-2">
                        <img src="${p.image_url}" alt="${p.title}" class="w-full h-32 object-cover rounded">
                        <h3 class="font-medium text-white">${p.title}</h3>
                        <p class="text-xs text-slate-400">${p.location_city}, ${p.location_country}</p>
                        <div class="flex justify-between items-center text-sm pt-2">
                            <span class="text-amber-400 font-semibold">€${p.base_price_per_night} / night</span>
                            <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300">${p.status}</span>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading properties:", err);
            }
        }

        function logout() {
            localStorage.removeItem('user_id');
            window.location.href = '/index.html';
        }

        loadHostProperties();
    </script>
</body>
</html>
